name: Design snapshots

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Record
        run: gradle :app:recordPaparazziDebug --no-daemon --stacktrace 2>&1 | tee snap.log
      - name: Report errors
        if: always()
        run: |
          grep -E '^e: |FAILED|Exception|What went wrong' -A3 snap.log | head -40 | while IFS= read -r line; do echo "::warning::$line"; done
      - name: Stack
        if: always()
        run: |
          python3 - <<'EOF2'
          import glob, xml.etree.ElementTree as ET
          for f in glob.glob('app/build/test-results/testDebugUnitTest/*.xml'):
              for fl in ET.parse(f).getroot().iter('failure'):
                  ls = [l.strip() for l in (fl.text or '').splitlines()]
                  keep = [l for l in ls if 'om.yousef' in l or 'Exception' in l or 'Caused' in l][:9]
                  print('::error::' + ' | '.join(keep)[:3000])
          EOF2
      - name: Logo sheet
        if: always()
        run: |
          mkdir -p app/build/logo-preview
          ct=$(curl -s -o /tmp/x -w "%{content_type}" -H "Accept: image/png,image/*" https://i.imgur.com/CiA3plN.png); echo "::error::imgur type $ct $(file -b /tmp/x | head -c 60)"
          kotlinc tools/LogoSheet.kt app/src/main/java/om/yousef/shashati/data/LogoCleaner.kt -include-runtime -d sheet.jar 2>&1 | grep -v warning | head -20
          java -jar sheet.jar channels.json app/build/logo-preview/logos.png
      - name: Publish images to the snapshots branch
        if: always()
        run: |
          mkdir -p /tmp/out && cp app/src/test/snapshots/images/*.png app/build/logo-preview/*.png /tmp/out/ 2>/dev/null || true
          cd /tmp/out
          git init -q -b snapshots
          git -c user.name=ci -c user.email=ci@example.com add -A
          git -c user.name=ci -c user.email=ci@example.com commit -q -m "snapshots ${{ github.run_number }}" || exit 0
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" snapshots
