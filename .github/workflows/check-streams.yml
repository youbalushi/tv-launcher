name: Check streams

on:
  push:
    paths: ['.github/workflows/check-streams.yml']

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check
        run: |
          out=""
          while read -r url; do
            [ -z "$url" ] && continue
            body=$(curl -sL -m 20 -A "Mozilla/5.0" "$url" | head -c 400 | tr '\n' ' ')
            code=$(curl -sL -m 20 -A "Mozilla/5.0" -o /dev/null -w '%{http_code}' "$url")
            first=$(echo "$body" | head -c 120)
            out="$out $code | $url | $first ;;"
          done <<'LIST'
          https://svs.itworkscdn.net/syriatvlive/syriatv.smil/syriatvpublish/syriatv_720p/chunks_dvr.m3u8
          https://vo-live.cdb.cdn.orange.com/Content/Channel/MajidChildrenChannel/HLS/index.m3u8
          https://5aafcc5de91f1.streamlock.net/atfal1.com/atfal2/playlist.m3u8
          https://playlist.fasttvcdn.com/pl/ptllxjd03j6g9oxxjdfapg/roya-kids/playlist.m3u8
          https://edge66.magictvbox.com/liveApple/al_majd/tracks-v1a1/mono.m3u8
          https://media2.streambrothers.com:1936/8122/8122/playlist.m3u8
          LIST
          echo "::notice::$out"
