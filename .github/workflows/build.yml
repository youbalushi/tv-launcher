name: Build APK

on:
  push:
    branches: [main]
    paths-ignore:
      - 'channels.json'
      - 'results/**'
      - 'tools/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build
        id: build
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Report compile errors as annotations
        if: failure()
        run: |
          grep -E '^e: ' build.log | head -60 | while IFS= read -r line; do
            f=$(echo "$line" | sed -E 's#^e: file://[^ ]*/([a-z]*/src/[^:]*):([0-9]+):([0-9]+) (.*)#\1#')
            l=$(echo "$line" | sed -E 's#^e: file://[^ ]*/[a-z]*/src/[^:]*:([0-9]+):.*#\1#')
            m=$(echo "$line" | sed -E 's#^e: file://[^ ]*/[a-z]*/src/[^:]*:[0-9]+:[0-9]+ ##')
            echo "::error file=$f,line=$l::$m"
          done
          grep -E 'FAILURE|What went wrong|ERROR|error:' -A6 build.log | head -80 | while IFS= read -r line; do
            echo "::warning::$line"
          done

      - name: Rename APKs
        run: |
          cp app/build/outputs/apk/release/app-release.apk shashati.apk
          cp remote/build/outputs/apk/release/remote-release.apk shashati-remote.apk

      - uses: actions/upload-artifact@v4
        with:
          name: shashati-apk
          path: |
            shashati.apk
            shashati-remote.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: شاشتي – إصدار ${{ github.run_number }}
          files: |
            shashati.apk
            shashati-remote.apk
          make_latest: true
